# PatBot's own roster-construction policy. This is intentionally separate from
# opponent behavior: these are hard/soft rules for our team only.
#
# Philosophy: do not draft by a rigid "fill starters first" sequence. If an
# RB/WR is the better value, PatBot may build bench depth before QB1/TE1/FLEX is
# complete. Hard constraints protect scarce bench slots from low-optionality
# duplication.

value_aware: true
allow_bench_before_starters_complete: true

# One-QB league: once QB1 is drafted, every other QB leaves PatBot's draft board.
# This is intentionally NOT quality-aware: even a merely adequate QB1 keeps QB2
# blocked because a second QB cannot occupy FLEX in this format.
max_qb_drafted: 1

# TE is different because a second TE can theoretically become the starter or a
# FLEX. TE2 therefore remains possible before the offense is complete, but the
# hurdle depends on the quality of TE1.
max_te_drafted: 2
allow_te2_before_offense_complete: true
te2_quality_strategy:
  enabled: true

  # TE1 quality is derived from PatBot TE VORP, not hard-coded player names.
  # Top 3 = elite; next five = solid; everyone else = weak/replaceable.
  elite_te1_top_n: 3
  solid_te1_top_n: 8

  # Behind an elite TE1, TE2 is a luxury FLEX pick. It must beat the best
  # currently available RB/WR by a wide PatBot-score margin AND, if we already
  # have a FLEX-quality excess RB/WR/TE on the roster, project materially above
  # that current FLEX option too.
  elite_required_score_edge_over_best_rbwr: 7.5
  elite_required_projected_points_edge_over_current_flex: 10.0

  # Behind a solid TE1, TE2 still needs a clear advantage over the best available
  # RB/WR, but we do not impose the extra current-FLEX projection hurdle.
  solid_required_score_edge_over_best_rbwr: 3.0

  # Behind a weak TE1, leave TE2 normally available so PatBot can take a real
  # second swing at the position. No extra RB/WR comparison gate is imposed.
  weak_te1_unrestricted: true

# Once QB/RB/WR/TE/FLEX are all covered, no more TE/QB bench picks: remaining
# offensive selections are RB/WR upside swings.
post_offense_complete_positions: [RB, WR]

# Offensive completion means QB1, RB2, WR3, TE1 and one FLEX-eligible excess
# player are all rostered. K and D/ST are deliberately excluded; their separate
# Round 14 / Round 15 strategy remains in league.yaml.
completion_positions: [QB, RB, WR, TE, FLEX]
