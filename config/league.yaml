league:
  platform: yahoo
  season: 2026
  teams: 12
  draft_type: snake
  draft_slot: 3
  ppr: 1.0
  draft_order:
    1: Paul
    2: Faherty
    3: PatBot
    4: James
    5: Potter
    6: Sarlo
    7: Dave
    8: Frank
    9: Matt
    10: George
    11: Lou
    12: Vinnie

roster:
  QB: 1
  RB: 2
  WR: 3
  TE: 1
  FLEX: 1
  K: 1
  DEF: 1
  BN: 5
  IR: 1
  flex_eligible: [RB, WR, TE]

scoring:
  pass_completion: 0.25
  pass_yards_per_point: 25
  pass_td: 4
  interception: -2

  pass_yard_bonuses:
    - {threshold: 320, points: 1}
    - {threshold: 350, points: 3}
    - {threshold: 380, points: 1}

  rush_yards_per_point: 10
  rush_td: 6
  rush_yard_bonuses:
    - {threshold: 130, points: 1}
    - {threshold: 155, points: 3}
    - {threshold: 180, points: 1}

  reception: 1.0
  rec_yards_per_point: 10
  rec_td: 6
  rec_yard_bonuses:
    - {threshold: 140, points: 1}
    - {threshold: 165, points: 3}
    - {threshold: 190, points: 1}

  return_td: 6
  two_point_conversion: 2
  fumble_lost: -2
  offensive_fumble_return_td: 6

  # K and DEF remain provider-projection based until Yahoo settings import
  # confirms the league-specific kicker/defense rules.

bonus_model:
  pass_yards:
    sd_floor: 55
    sd_pct_of_mean: 0.28
  rush_yards:
    sd_floor: 25
    sd_pct_of_mean: 0.55
  rec_yards:
    sd_floor: 30
    sd_pct_of_mean: 0.65

draft_engine:
  replacement_rank:
    QB: 12
    RB: 30
    WR: 42
    TE: 14
    K: 12
    DEF: 12

  weights:
    vorp: 0.35
    projection: 0.25
    urgency: 0.20
    scarcity: 0.12
    roster_fit: 0.08

  injury_risk_penalty: 8.0
  min_round_k: 13
  min_round_def: 13

  bench_position_caps:
    QB: 2
    TE: 2
    K: 1
    DEF: 1

kicker_scoring:
  field_goal_made:
    0_19: 3
    20_29: 3
    30_39: 3
    40_49: 4
    50_plus: 5
  field_goal_missed:
    0_19: -1
    20_29: -1
    30_39: -1
    40_49: -1
  extra_point_made: 1
  extra_point_missed: -1

defense_scoring:
  sack: 1
  interception: 2
  fumble_recovery: 2
  touchdown: 6
  safety: 2
  blocked_kick: 2
  extra_point_returned: 2
  points_allowed:
    0: 10
    1_6: 7
    7_13: 4
    14_20: 1
    21_27: 0
    28_34: -1
    35_plus: -4

v03_consensus:
  fantasypros_api: true
  fantasypros_rankings: false
  fantasypros_adp: false
  fantasydata_rankings: true

  weights:
    custom_vorp: 0.55
    expert_rank: 0.30
    market_rank: 0.15

  tiering:
    gap_multiplier: 2.5
    absolute_gap_floor: 2.0
    minimum_tier_size: 2
    maximum_tier_size: 8

simulation:
  default_runs: 300
  max_runs: 1500
  through_round: 8
  opponent_adp_sd_floor: 5.0
  opponent_adp_sd_pct: 0.14

opponent_archetypes:
  # 11 opponents + PatBot = 12 teams.
  counts:
    casual: 4
    market: 3
    league_aware: 2
    sharp: 1
    extremely_sharp: 1

  # Real 2026 room: archetypes are locked to actual draft slots.
  fixed_by_slot:
    1: casual
    2: market
    4: casual
    5: market
    6: league_aware
    7: sharp
    8: casual
    9: market
    10: league_aware
    11: extremely_sharp
    12: casual

  casual:
    market_weight: 0.95
    custom_weight: 0.05
    roster_need_strength: 0.55
    randomness: 1.20

  market:
    market_weight: 0.82
    custom_weight: 0.18
    roster_need_strength: 0.75
    randomness: 1.00

  league_aware:
    market_weight: 0.55
    custom_weight: 0.45
    roster_need_strength: 0.95
    randomness: 0.85

  sharp:
    market_weight: 0.32
    custom_weight: 0.68
    roster_need_strength: 1.15
    randomness: 0.70

  extremely_sharp:
    market_weight: 0.15
    custom_weight: 0.85
    roster_need_strength: 1.30
    randomness: 0.55

# Manager-specific adjustments. These sit on top of the archetype defaults.
opponent_managers:
  1:
    name: Paul
    archetype: casual
    randomness: 1.40
    roster_need_strength: 0.45
    notes: "Casual; can make boneheaded decisions."
  2:
    name: Faherty
    archetype: market
    rookie_rank_bonus: 12.0
    notes: "Market-oriented; historically leans heavily toward rookies."
  4:
    name: James
    archetype: casual
    randomness: 1.50
    roster_need_strength: 0.40
    inseason_engagement: low
    notes: "Very casual; high risk of checking out during the season."
  5:
    name: Potter
    archetype: market
    notes: "Market baseline."
  6:
    name: Sarlo
    archetype: league_aware
    randomness: 0.78
    roster_need_strength: 1.05
    notes: "League-aware and generally by the book."
  7:
    name: Dave
    archetype: sharp
    notes: "Sharp."
  8:
    name: Frank
    archetype: casual
    randomness: 1.60
    roster_need_strength: 0.35
    notes: "Very casual; usually near the bottom. Possible AI use is unconfirmed, so current model stays casual until observed behavior says otherwise."
  9:
    name: Matt
    archetype: market
    market_weight: 0.68
    custom_weight: 0.32
    roster_need_strength: 0.85
    randomness: 0.92
    notes: "Between market and league-aware."
  10:
    name: George
    archetype: league_aware
    market_weight: 0.43
    custom_weight: 0.57
    roster_need_strength: 1.05
    randomness: 0.78
    notes: "League-aware, bordering sharp."
  11:
    name: Lou
    archetype: extremely_sharp
    notes: "Extremely sharp; usually wins the league."
  12:
    name: Vinnie
    archetype: casual
    randomness: 1.45
    roster_need_strength: 0.40
    notes: "Very casual."

roster_evaluation:
  bench_vorp_discount: 0.20

  empty_group_penalty:
    RB: 18
    WR: 12

  missing_starter_penalty:
    QB: 7
    RB: 12
    WR: 9
    TE: 6
    FLEX: 7

  construction_bonus:
    has_qb: 2
    has_te: 2
    has_two_rb: 6
    has_three_wr: 6
    has_flex_depth: 3
